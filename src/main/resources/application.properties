spring.application.name=jitterticket-event-sourced

# Location of the CSV file for events
event.store.csv.directory=events

# Which Event Store type to use: in_memory, csv, jdbc, jdbc_client
event.store.type=jdbc

# PostgreSQL database info
spring.datasource.url=jdbc:postgresql:jitterticket
# turns JDBC batches into multi-row INSERTs (much faster for bulk loads)
# set as a driver property (not on the URL) so it also applies when Docker Compose supplies the connection details
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
spring.datasource.username=postgres
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=always
